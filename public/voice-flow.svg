<rect x="667" y="216" width="183" height="207" rx="18" fill="#1b3458" stroke="#4d6687"/><rect x="737" y="251" width="51" height="60" rx="5" fill="none" stroke="#ebc477" stroke-width="4"/><path d="M748 267h28M748 280h28M748 293h19" stroke="#ebc477" stroke-width="3" stroke-linecap="round"/><text x="759" y="350" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Knowledge</text><text x="759" y="377" text-anchor="middle" fill="#a8b9d0" font-family="Arial,sans-serif" font-size="14">Grounded in your sources</text>
<rect x="978" y="216" width="170" height="207" rx="18" fill="#1b3458" stroke="#4d6687"/><circle cx="1063" cy="270" r="18" fill="none" stroke="#ebc477" stroke-width="4"/><path d="M1028 314c5-21 65-21 70 0" fill="none" stroke="#ebc477" stroke-width="4" stroke-linecap="round"/><text x="1063" y="350" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Human team</text><text x="1063" y="377" text-anchor="middle" fill="#a8b9d0" font-family="Arial,sans-serif" font-size="14">Take over with context</text>
