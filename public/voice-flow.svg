<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">VoxOps conversation architecture</title><desc id="desc">A call moves through voice understanding, trusted knowledge and an optional human handoff, with an observable event trail.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#132748"/><stop offset="1" stop-color="#0c1830"/></linearGradient><linearGradient id="gold" x2="1"><stop stop-color="#e6b866"/><stop offset="1" stop-color="#f3d99d"/></linearGradient><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#3c5675" stroke-opacity=".19"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="12"/></filter></defs>
<rect width="1200" height="680" rx="24" fill="url(#bg)"/><rect width="1200" height="680" fill="url(#grid)"/>
<circle cx="600" cy="327" r="212" fill="#244775" opacity=".18" filter="url(#glow)"/>
<text x="58" y="64" fill="#e6b866" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4">THE CONVERSATION ENGINE</text>
<text x="58" y="103" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">One call. Connected context.</text>
<text x="58" y="132" fill="#9eb0c8" font-family="Arial,sans-serif" font-size="17">Every decision stays visible from first ring to final outcome.</text>
